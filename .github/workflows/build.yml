
name: ESG AI Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gradle sürümünü kontrol et
        run: gradle --version

      - name: Debug APK derle
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: APK dosyasını ESG-AI.apk olarak adlandır
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ESG-AI.apk

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: ESG-AI-APK
          path: dist/ESG-AI.apk
          if-no-files-found: error
