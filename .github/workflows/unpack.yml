name: ESG AI ZIP Extract

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o ESG_AI_Tam_Proje.zip -d extracted
          cp -r extracted/ESG_AI_Tam_Proje/. .
          rm -rf extracted

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract ESG AI project files" || echo "No changes"
          git push
